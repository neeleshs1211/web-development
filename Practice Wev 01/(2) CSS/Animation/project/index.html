<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            width: 100vw;
            height: 100vh;
            background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ21tYopYYghVtIz5DHFx6qnRUA6VETjOjFh1cGq91oM-33BgUwLEkBfp8&s=10");
            background-repeat: no-repeat;
            background-size: 100% 100%;
            position: relative;
        }

        img{
            width: 220px;
            height: 200px;
            animation: leftToright 2s linear infinite ;
            position: absolute;
            bottom: 0%;
        }
        @keyframes leftToright{
            0%{
                translate:-10vw;
            }
            100%{
               translate:100vw;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="mario-run.gif" alt="">
    </div>
</body>
</html>
